{% extends "base.html" %}

{% block content %}
<section class="hero-panel">
  <div class="hero-copy">
    <p class="eyebrow">CSV 기반 가계부</p>
    <h1>가계부 웹</h1>
    <p class="hero-text">
      거래 내역, 월별 흐름, 조건 검색을 한 화면 흐름으로 확인합니다.
    </p>
  </div>
  <div class="metric-strip" aria-label="주요 기능">
    <a class="feature-card" href="/transactions">
      <span class="feature-title">거래 목록</span>
      <span class="feature-text">CSV 거래를 표로 확인</span>
    </a>
    <a class="feature-card" href="/summary">
      <span class="feature-title">월별 요약</span>
      <span class="feature-text">수입, 지출, 잔액 집계</span>
    </a>
    <a class="feature-card" href="/search">
      <span class="feature-title">검색</span>
      <span class="feature-text">날짜와 카테고리 필터</span>
    </a>
  </div>
</section>
{% endblock %}
