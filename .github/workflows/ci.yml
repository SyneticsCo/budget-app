name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    name: pytest / coverage / complexity / style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: pytest with coverage
        run: pytest --cov=app --cov=budget --cov-report=term-missing --cov-fail-under=70

      - name: radon complexity report
        run: radon cc -s app budget tests

      - name: xenon complexity gate
        run: xenon --max-absolute B --max-modules B --max-average B app budget tests

      - name: flake8 style gate
        run: |
          flake8 app budget tests
